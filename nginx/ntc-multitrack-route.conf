# NTC MultiTrack runs on the Mac Pro behind Tailscale Serve. This snippet is
# included inside the ntcnas.myftp.org server block.
location = /multitrack {
  proxy_pass https://100.109.220.95;

  proxy_http_version 1.1;
  proxy_ssl_server_name on;
  proxy_ssl_name ntc-macpro.tailee4a3f.ts.net;
  proxy_set_header Host ntc-macpro.tailee4a3f.ts.net;
  proxy_set_header X-Forwarded-Scheme $scheme;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Prefix /multitrack;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $http_connection;

  proxy_connect_timeout 30s;
  proxy_send_timeout 3600s;
  proxy_read_timeout 3600s;
  proxy_buffering off;
  proxy_cache off;
  client_max_body_size 256M;

  add_header X-NTC-MultiTrack-Route macpro-tailnet always;
}

location ^~ /multitrack/ {
  proxy_pass https://100.109.220.95;

  proxy_http_version 1.1;
